<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title th:text="${title}">Référentiel d'Expertise, de Connaissances et de Pratiques</title>
    <meta property="og:title" content="Far Flung Apt Pig" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <meta property="twitter:card" content="summary_large_image" />

    <style data-tag="reset-style-sheet">
      html {  line-height: 1.15;}body {  margin: 0;}* {  box-sizing: border-box;  border-width: 0;  border-style: solid;  -webkit-font-smoothing: antialiased;}p,li,ul,pre,div,h1,h2,h3,h4,h5,h6,figure,blockquote,figcaption {  margin: 0;  padding: 0;}button {  background-color: transparent;}button,input,optgroup,select,textarea {  font-family: inherit;  font-size: 100%;  line-height: 1.15;  margin: 0;}button,select {  text-transform: none;}button,[type="button"],[type="reset"],[type="submit"] {  -webkit-appearance: button;  color: inherit;}button::-moz-focus-inner,[type="button"]::-moz-focus-inner,[type="reset"]::-moz-focus-inner,[type="submit"]::-moz-focus-inner {  border-style: none;  padding: 0;}button:-moz-focus,[type="button"]:-moz-focus,[type="reset"]:-moz-focus,[type="submit"]:-moz-focus {  outline: 1px dotted ButtonText;}a {  color: inherit;  text-decoration: inherit;}input {  padding: 2px 4px;}img {  display: block;}details {  display: block;  margin: 0;  padding: 0;}summary::-webkit-details-marker {  display: none;}[data-thq="accordion"] [data-thq="accordion-content"] {  max-height: 0;  overflow: hidden;  transition: max-height 0.3s ease-in-out;  padding: 0;}[data-thq="accordion"] details[data-thq="accordion-trigger"][open] + [data-thq="accordion-content"] {  max-height: 1000vh;}details[data-thq="accordion-trigger"][open] summary [data-thq="accordion-icon"] {  transform: rotate(180deg);}html { scroll-behavior: smooth  }
    </style>
    <style data-tag="default-style-sheet">
      html {
        font-family: Inter;
        font-size: 16px;
      }

      body {
        font-weight: 400;
        font-style:normal;
        text-decoration: none;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1.15;
        color: var(--dl-color-theme-neutral-dark);
        background: var(--dl-color-theme-neutral-light);

        fill: var(--dl-color-theme-neutral-dark);
      }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/animate.css@4.1.1/animate.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
      data-tag="font"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&amp;display=swap"
      data-tag="font"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
      data-tag="font"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@teleporthq/teleport-custom-scripts/dist/style.css"
    />
  </head>
  <body>
    <link rel="stylesheet" href="./style.css" />
    <div>
      <link href="./index.css" rel="stylesheet" />

      <div class="home-container10">
        <span class="home-text10">RECP</span>
        <div class="home-container11">
          <div class="home-container12">
            <span class="home-text11">Find a pattern</span>
            <div class="home-container13">
              <input
                type="text"
                placeholder="Pattern's name"
                id="InputPatternName"
                name="InputPatternName"
                class="home-textinput input"
              />
              <button
                type="button"
                id="bSearchPattern"
                name="bSearchPattern"
                class="button"
              >
                Search
              </button>
            </div>
          </div>
          <div class="home-container14">
            <span class="home-text12">Operation to do</span>
            <div class="home-container15">
              <div class="home-container16">
                <div class="home-container17">
                  <div class="home-container18">
                    <div class="home-container19">
                      <div class="home-container20">
                        <div class="home-container21">
                          <div class="home-container22">
                            <div class="home-container23">
                              <div class="home-container24">
                                <input
                                  type="checkbox"
                                  checked="true"
                                  value="Search"
                                  name="cbSearchOperation"
                                  id="cbSearchOperation"
                                  autocomplete="Search"
                                  class="home-checkbox1"
                                />
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <span class="home-text13">Search</span>
                    </div>
                    <input
                      type="checkbox"
                      checked="true"
                      value="Search"
                      name="cbUpdateOperation"
                      id="cbUpdateOperation"
                      autocomplete="Search"
                      class="home-checkbox2"
                    />
                  </div>
                  <span class="home-text14">Update</span>
                </div>
                <input
                  type="checkbox"
                  checked="true"
                  value="Search"
                  name="cbDeleteOperation"
                  id="cbDeleteOperation"
                  autocomplete="Search"
                  class="home-checkbox3"
                />
              </div>
              <span class="home-text15">Delete</span>
            </div>
            <div class="home-container25">
              <div class="home-container26"></div>
            </div>
          </div>
        </div>
        <div class="home-container27">
          <div class="home-container28">
            <span class="home-text16">Name:</span>
            <span id="textPatternName" class="home-text17">
              variablePatternName
            </span>
          </div>
          <div class="home-container29">
            <span class="home-text18">Problem to solve:</span>
            <span id="textPatternProblem" class="home-text19">
              variablePatternProblemToResolve
            </span>
          </div>
          <span class="home-text20">Generic Model</span>
          <img
            src="https://play.teleporthq.io/static/svg/default-img.svg"
            alt="image"
            id="ImgPatternGenericModel"
            class="home-image1"
          />
          <span class="home-text21">Illustration Model</span>
          <img
            src="https://play.teleporthq.io/static/svg/default-img.svg"
            alt="image"
            id="ImgPatternIllustrationMod"
            class="home-image2"
          />
        </div>
      </div>
    </div>
  </body>
</html>
